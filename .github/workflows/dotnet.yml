name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build MotionStabilizer/MotionStabilizer.csproj -c Release --nologo

      - name: Run tests (Release)
        run: dotnet test MotionStabilizer.Tests/MotionStabilizer.Tests.csproj -c Release --no-build --nologo
